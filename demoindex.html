<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body {
            min-height: 100vh;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 { color: #1e293b; font-size: 2rem; }
        #datetime { color: #64748b; margin-top: 0.5rem; font-size: 0.9rem; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
        }

.card {
    background: linear-gradient(to bottom, #d6ffff, #b3eeee); /* Verloopt van boven naar beneden */
    border-radius: 12px;
    padding: 2rem;
    text-decoration: none;
    color: #1e293b;
    font-size: 1.25rem;
    font-weight: 600;
    text-align: center;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    border: 1px solid #e2e8f0;
}
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            border-color: #3b82f6;
            color: #3b82f6;
        }

.membercard img {
    width: 85.6mm;                /* Echte breedte van een creditcard */
    height: 53.98mm;              /* Echte hoogte van een creditcard */
    object-fit: cover;            /* Voorkomt vervorming van de foto */
    border-radius: 4mm;           /* Ronde hoekjes passend bij een pasje */
}

        
    </style>
</head>
<body>

    <header>
        <h1>Demo QR Rit en Abonnementen toegangsbeheer Dashboard</h1>
        <p id="datetime"></p>
    </header>

    <main class="grid">
        
        <a href="https://rich7.github.io/eRitten-Demo/admin.html" class="card">QR toegang admin</a>
        
        <div class="card">
            <a href="https://rich7.github.io/eRitten-Demo/scanner.html" class="card">QR scanners 
            \n lid: 9991  wachtwoord: test1234</a>
            
        </div>
              
        <div class="card">
            <a href="https://rich7.github.io/eRitten-Demo/lid.html" class="card">Lid app \n lid: 5556  email: vanoranje@niet.nl</a>    
            
        </div>
            <!-- VUL HIER JE LINK IN bij href="" -->
        <a href="https://docs.google.com/spreadsheets/d/1LHm-mzf8EvICHPYw2xN5iL0ImvYcfj4quDicpionZQU/edit?gid=0#gid=0" class="card">Backend</a>
        <div class="membercard">
            <h3>Scan Ere lid Altijd toegang</h3>
            <img src="QRcode erelid .JPG" alt="Erelid altijd toegang">
        </div>
        <div class="membercard">
            <h3>Scan Rittenkaart (schrijft 1 rit af)</h3>
            <img src="QRcode 100 ritten.JPG" alt="1000 ritten Kaart">
        </div>
        <div class="membercard">
            <h3>Scan Verlopen kaart</h3>
            <img src="QRVerlopen.JPG" alt="Verlopen">
        </div>

    </main>

     <h1>Flow chart</h1>
     <img src="flowchart.JPG" alt="Flow chart">

    
    <script>
        // Update datum en tijd
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('datetime').textContent = now.toLocaleDateString('nl-NL', options);
        }
        updateDateTime();
        setInterval(updateDateTime, 60000);
    </script>

</body>
</html>
