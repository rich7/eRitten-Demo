<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rittenkaart - Scanner</title>
<style>
  :root {
    --bg: #111417;
    --card: #1c2126;
    --primary: #2c6e49;
    --border: #2e343b;
    --muted: #9aa3ab;
    --ok-bg: #1e4620;
    --ok-fg: #8ee89c;
    --err-bg: #4a1f1f;
    --err-fg: #f29b9b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #loginScreen {
    max-width: 320px;
    margin: 80px auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
  }
  h1 { font-size: 1.2rem; margin: 0 0 16px; text-align: center; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #10141a;
    color: #eee;
  }
  button {
    margin-top: 14px;
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; display: none; }
  .msg.show { display: block; background: var(--err-bg); color: var(--err-fg); }

  #scanScreen {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    display: none;
    flex-direction: column;
    align-items: center;
  }
  #verenigingTitel { font-size: 1rem; color: var(--muted); margin: 0 0 12px; text-align: center; }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: black;
    border: 3px solid var(--border);
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  #resultOverlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  #resultOverlay.ok { background: rgba(30, 70, 32, 0.95); }
  #resultOverlay.err { background: rgba(74, 31, 31, 0.95); }
  #resultOverlay .naam { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
  #resultOverlay .melding { font-size: 1rem; margin-bottom: 4px; }
  #resultOverlay .saldo { font-size: 0.9rem; opacity: 0.85; }
  #status { margin-top: 16px; color: var(--muted); font-size: 0.9rem; text-align: center; }

  #handmatigKnop {
    margin-top: 14px;
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #handmatigKnop:hover { color: #eee; border-color: #555; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 20px; overflow-y: auto; z-index: 200;
  }
  .hidden { display: none !important; }
  .modal-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; max-width: 380px; width: 100%; position: relative; margin-top: 40px;
  }
  .modal-card h2 { font-size: 1.1rem; margin: 0 0 14px; }
  .modal-sluiten {
    position: absolute; top: 10px; right: 10px; background: none; border: none;
    font-size: 1.2rem; cursor: pointer; margin: 0; padding: 4px 8px; color: var(--muted);
  }
  #handmatigZoek {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.95rem; background: #10141a; color: #eee;
  }
  #handmatigResultaten { margin-top: 10px; max-height: 240px; overflow-y: auto; }
  .handmatig-result {
    width: 100%; text-align: left; background: #10141a; color: #eee;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    margin-top: 6px; cursor: pointer; font-size: 0.9rem;
  }
  .handmatig-result:hover { border-color: var(--primary); }
  .handmatig-result .lidnr { color: var(--muted); font-size: 0.8rem; }

  #handmatigDetail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .detail-naam { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
  .status-geldig { color: #8ee89c; font-weight: 600; }
  .status-verlopen { color: #f29b9b; font-weight: 600; }
  #handmatigBevestigKnop {
    width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 8px;
    background: var(--primary); color: white; font-size: 0.95rem; cursor: pointer;
  }
  .msg-donker {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; display: none;
  }
  .msg-donker.ok { background: var(--ok-bg); color: var(--ok-fg); display: block; }
  .msg-donker.err { background: var(--err-bg); color: var(--err-fg); display: block; }

  #hervatOverlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.85);
    cursor: pointer;
  }
  #hervatOverlay .icoon { font-size: 2.4rem; margin-bottom: 10px; }
  #hervatOverlay .tekst { font-size: 1rem; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Rittenkaart scanner</h1>
  <form id="loginForm" onsubmit="login(event); return false;">
    <label>Lidnummer</label>
    <input type="text" id="loginLidnummer" name="username" autocomplete="username" placeholder="Jouw lidnummer">
    <label>Wachtwoord</label>
    <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Wachtwoord">
    <button type="submit">Inloggen</button>
  </form>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="scanScreen">
  <p id="verenigingTitel"></p>
  <div class="video-wrap">
    <video id="video" playsinline autoplay muted></video>
    <div id="resultOverlay">
      <div class="naam" id="resultNaam"></div>
      <div class="melding" id="resultMelding"></div>
      <div class="saldo" id="resultSaldo"></div>
    </div>
    <div id="hervatOverlay" onclick="hervatCamera()">
      <div class="icoon">&#128247;</div>
      <div class="tekst">Camera gestopt &mdash; tik om verder te scannen</div>
    </div>
  </div>
  <div id="status">Richt de camera op de QR-code</div>
  <button id="handmatigKnop" onclick="openHandmatig()">QR vergeten? Handmatig zoeken</button>
</div>

<div id="handmatigOverlay" class="modal-overlay hidden">
  <div class="modal-card">
    <button class="modal-sluiten" onclick="sluitHandmatig()">&#10005;</button>
    <h2>Handmatig zoeken</h2>
    <input id="handmatigZoek" placeholder="Naam of lidnummer" oninput="zoekHandmatigDebounced()">
    <div id="handmatigResultaten"></div>

    <div id="handmatigDetail" class="hidden">
      <div class="detail-naam" id="handmatigDetailNaam"></div>
      <div id="handmatigDetailStatus"></div>
      <button id="handmatigBevestigKnop" onclick="bevestigHandmatig()"></button>
    </div>

    <div id="handmatigMsg" class="msg-donker"></div>
  </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
  // ---- CONFIGURATIE: pas dit aan per vereniging voordat je deployt ----
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx39GhCUTB7qq7Fg4xdVWqK5vozI2LsgmSokAKSzSmBfdT34QrVtY33YxsFBjlzPQjxHg/exec';
  // -----------------------------------------------------------------

  let ingelogdLidnummer = '';
  let handmatigModusActief = false;
  let handmatigZoekTimer = null;
  let handmatigGeselecteerd = null;
  let scanning = false;
  let processing = false;
  let cooldownUntil = 0;
  const SCAN_LOOP_COOLDOWN_MS = 3000; // stop met scannen na een resultaat
  const SCAN_INTERVAL_MS = 120; // max. ~8 scanpogingen per seconde, scheelt flink in warmte/batterij
  const SCAN_MAX_AFMETING = 400; // beeld wordt hiernaar verkleind voor het decoderen
  let laatsteScanPoging = 0;
  let berichtDuurMs = 5000; // wordt overschreven met instelling uit adminpaneel bij inloggen

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  async function roepApi(payload) {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
    const tekst = await res.text();
    let json;
    try {
      json = JSON.parse(tekst);
    } catch (e) {
      throw new Error(
        'Onverwacht antwoord van de server (status ' + res.status + '). Check of de laatste Code.gs ' +
        'geplakt en opnieuw geïmplementeerd is. Eerste tekens: ' + tekst.slice(0, 100)
      );
    }
    if (!json.success) throw new Error(json.error);
    return json.data;
  }

  async function login(e) {
    if (e) e.preventDefault();
    const lidnummer = document.getElementById('loginLidnummer').value.trim();
    const pw = document.getElementById('loginPassword').value;
    if (!lidnummer || !pw) return;
    try {
      const data = await roepApi({ action: 'checkScannerLogin', lidnummer: lidnummer, wachtwoord: pw });
      ingelogdLidnummer = data.lidnummer;
      berichtDuurMs = (data.berichtDuurSeconden || 5) * 1000;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('scanScreen').style.display = 'flex';
      document.getElementById('verenigingTitel').textContent =
        data.verenigingNaam + (data.naam ? ' \u2014 ingelogd als ' + data.naam : '');
      startCamera();
    } catch (err) {
      const msg = document.getElementById('loginMsg');
      msg.textContent = err.message;
      msg.className = 'msg show';
    }
  }

  async function startCamera() {
    stopCamera();
    document.getElementById('hervatOverlay').style.display = 'none';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',
          width: { ideal: 640 },
          height: { ideal: 640 }
        }
      });
      video.srcObject = stream;
      video.addEventListener('loadedmetadata', () => {
        scanning = true;
        requestAnimationFrame(scanLoop);
      }, { once: true });
    } catch (err) {
      document.getElementById('status').textContent = 'Kan camera niet openen: ' + err.message;
    }
  }

  function stopCamera() {
    scanning = false;
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }
  }

  function hervatCamera() {
    document.getElementById('hervatOverlay').style.display = 'none';
    startCamera();
  }

  document.addEventListener('visibilitychange', () => {
    const scanSchermActief = document.getElementById('scanScreen').style.display !== 'none';
    if (!scanSchermActief) return;

    if (document.visibilityState === 'hidden') {
      stopCamera(); // bewust stoppen i.p.v. laten "doodbloeden" - scheelt batterij
    } else {
      const tracks = video.srcObject ? video.srcObject.getVideoTracks() : [];
      const isLive = tracks.length > 0 && tracks[0].readyState === 'live';
      if (!isLive) {
        document.getElementById('hervatOverlay').style.display = 'flex';
      }
    }
  });

  /** Vangnet: controleert periodiek of de camerastream nog leeft. */
  setInterval(() => {
    const scanSchermActief = document.getElementById('scanScreen').style.display !== 'none';
    if (!scanSchermActief || document.visibilityState === 'hidden') return;

    const tracks = video.srcObject ? video.srcObject.getVideoTracks() : [];
    const isLive = tracks.length > 0 && tracks[0].readyState === 'live';

    if (!isLive) {
      scanning = false;
      document.getElementById('hervatOverlay').style.display = 'flex';
    }
  }, 2000);

  function scanLoop() {
    if (!scanning) return;

    if (handmatigModusActief) {
      requestAnimationFrame(scanLoop);
      return;
    }

    if (processing || Date.now() < cooldownUntil) {
      requestAnimationFrame(scanLoop);
      return;
    }

    if (Date.now() - laatsteScanPoging < SCAN_INTERVAL_MS) {
      requestAnimationFrame(scanLoop);
      return;
    }
    laatsteScanPoging = Date.now();

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      const schaal = Math.min(1, SCAN_MAX_AFMETING / Math.max(video.videoWidth, video.videoHeight));
      canvas.width = Math.round(video.videoWidth * schaal);
      canvas.height = Math.round(video.videoHeight * schaal);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) {
        processing = true; // meteen blokkeren, voordat het antwoord binnen is
        handleScan(code.data);
        requestAnimationFrame(scanLoop);
        return;
      }
    }
    requestAnimationFrame(scanLoop);
  }

  async function handleScan(token) {
    document.getElementById('status').textContent = 'Bezig met controleren...';
    try {
      const data = await roepApi({ action: 'scan', token: token, scannerLidnummer: ingelogdLidnummer });
      showResult(data);
    } catch (err) {
      showResult({ naam: '', toegestaan: false, melding: err.message, saldo: '' });
    } finally {
      processing = false;
      cooldownUntil = Date.now() + SCAN_LOOP_COOLDOWN_MS;
    }
  }

  function piepEnTril(toegestaan) {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctxAudio = new AudioCtx();
      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      osc.connect(gain);
      gain.connect(ctxAudio.destination);
      gain.gain.setValueAtTime(0.3, ctxAudio.currentTime);
      if (toegestaan) {
        osc.type = 'sine';
        osc.frequency.value = 880;
        osc.start();
        osc.stop(ctxAudio.currentTime + 0.15);
      } else {
        osc.type = 'square';
        osc.frequency.value = 220;
        osc.start();
        osc.stop(ctxAudio.currentTime + 1.2);
      }
    } catch (e) { /* geluid niet ondersteund, geen probleem */ }

    if (navigator.vibrate) {
      navigator.vibrate(toegestaan ? 120 : 1200);
    }
  }

  function showResult(data) {
    const overlay = document.getElementById('resultOverlay');
    overlay.className = data.toegestaan ? 'ok' : 'err';
    document.getElementById('resultNaam').textContent = data.naam || '';
    document.getElementById('resultMelding').textContent = data.melding;
    document.getElementById('resultSaldo').textContent =
      data.type === 'Abonnement'
        ? (data.vervalDatum ? 'Abonnement t/m ' + data.vervalDatum : '')
        : (data.saldo !== '' && data.saldo !== undefined ? 'Nog ' + data.saldo + ' ritten over' : '');
    overlay.style.display = 'flex';
    piepEnTril(data.toegestaan);
    document.getElementById('status').textContent = 'Richt de camera op de QR-code';
    setTimeout(() => { overlay.style.display = 'none'; }, berichtDuurMs);
  }

  // ---- Handmatig zoeken (QR vergeten) ----

  function openHandmatig() {
    handmatigModusActief = true;
    document.getElementById('handmatigZoek').value = '';
    document.getElementById('handmatigResultaten').innerHTML = '';
    document.getElementById('handmatigDetail').classList.add('hidden');
    document.getElementById('handmatigMsg').className = 'msg-donker';
    handmatigGeselecteerd = null;
    document.getElementById('handmatigOverlay').classList.remove('hidden');
    document.getElementById('handmatigZoek').focus();
  }

  function sluitHandmatig() {
    handmatigModusActief = false;
    document.getElementById('handmatigOverlay').classList.add('hidden');
  }

  function zoekHandmatigDebounced() {
    clearTimeout(handmatigZoekTimer);
    handmatigZoekTimer = setTimeout(zoekHandmatig, 300);
  }

  async function zoekHandmatig() {
    const query = document.getElementById('handmatigZoek').value.trim();
    const resultatenDiv = document.getElementById('handmatigResultaten');
    document.getElementById('handmatigDetail').classList.add('hidden');
    handmatigGeselecteerd = null;

    if (!query) {
      resultatenDiv.innerHTML = '';
      return;
    }

    try {
      const resultaten = await roepApi({ action: 'zoekLeden', query: query });
      resultatenDiv.innerHTML = '';
      if (resultaten.length === 0) {
        resultatenDiv.innerHTML = '<p style="color:var(--muted);font-size:0.85rem;">Niets gevonden</p>';
        return;
      }
      resultaten.forEach(lid => {
        const btn = document.createElement('button');
        btn.className = 'handmatig-result';
        btn.innerHTML = lid.naam + ' <span class="lidnr">(' + lid.lidnummer + ')</span>';
        btn.addEventListener('click', () => selecteerHandmatigLid(lid));
        resultatenDiv.appendChild(btn);
      });
    } catch (err) {
      resultatenDiv.innerHTML = '';
      document.getElementById('handmatigMsg').textContent = err.message;
      document.getElementById('handmatigMsg').className = 'msg-donker err';
    }
  }

  function selecteerHandmatigLid(lid) {
    handmatigGeselecteerd = lid;
    document.getElementById('handmatigDetailNaam').textContent = lid.naam + ' (' + lid.lidnummer + ')';

    const statusDiv = document.getElementById('handmatigDetailStatus');
    const knop = document.getElementById('handmatigBevestigKnop');

    if (lid.type === 'Abonnement') {
      statusDiv.innerHTML = lid.geldig
        ? '<span class="status-geldig">Geldig t/m ' + lid.vervalDatum + '</span>'
        : '<span class="status-verlopen">Verlopen op ' + lid.vervalDatum + '</span>';
      knop.textContent = 'Toegang bevestigen';
    } else {
      statusDiv.textContent = 'Saldo: ' + lid.saldo + ' ritten';
      knop.textContent = '1 rit afboeken';
    }

    document.getElementById('handmatigMsg').className = 'msg-donker';
    document.getElementById('handmatigDetail').classList.remove('hidden');
  }

  async function bevestigHandmatig() {
    if (!handmatigGeselecteerd) return;
    try {
      const data = await roepApi({
        action: 'handmatigAfboeken',
        lidnummer: handmatigGeselecteerd.lidnummer,
        scannerLidnummer: ingelogdLidnummer
      });
      sluitHandmatig();
      showResult(data);
    } catch (err) {
      document.getElementById('handmatigMsg').textContent = err.message;
      document.getElementById('handmatigMsg').className = 'msg-donker err';
    }
  }
</script>
</body>
</html>
