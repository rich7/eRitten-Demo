<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rittenkaart - Scanner</title>
<style>
  :root {
    --bg: #111417;
    --card: #1c2126;
    --primary: #2c6e49;
    --border: #2e343b;
    --muted: #9aa3ab;
    --ok-bg: #1e4620;
    --ok-fg: #8ee89c;
    --err-bg: #4a1f1f;
    --err-fg: #f29b9b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #loginScreen {
    max-width: 320px;
    margin: 80px auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
  }
  h1 { font-size: 1.2rem; margin: 0 0 16px; text-align: center; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #10141a;
    color: #eee;
  }
  button {
    margin-top: 14px;
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; display: none; }
  .msg.show { display: block; background: var(--err-bg); color: var(--err-fg); }

  #scanScreen {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    display: none;
    flex-direction: column;
    align-items: center;
  }
  #verenigingTitel { font-size: 1rem; color: var(--muted); margin: 0 0 12px; text-align: center; }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: black;
    border: 3px solid var(--border);
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  #resultOverlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  #resultOverlay.ok { background: rgba(30, 70, 32, 0.95); }
  #resultOverlay.err { background: rgba(74, 31, 31, 0.95); }
  #resultOverlay .naam { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
  #resultOverlay .melding { font-size: 1rem; margin-bottom: 4px; }
  #resultOverlay .saldo { font-size: 0.9rem; opacity: 0.85; }
  #status { margin-top: 16px; color: var(--muted); font-size: 0.9rem; text-align: center; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Rittenkaart scanner</h1>
  <form id="loginForm" onsubmit="login(event); return false;">
    <input type="text" name="username" value="rittenkaart-scanner" autocomplete="username" style="display:none">
    <label>Wachtwoord</label>
    <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Wachtwoord">
    <button type="submit">Inloggen</button>
  </form>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="scanScreen">
  <p id="verenigingTitel"></p>
  <div class="video-wrap">
    <video id="video" playsinline autoplay muted></video>
    <div id="resultOverlay">
      <div class="naam" id="resultNaam"></div>
      <div class="melding" id="resultMelding"></div>
      <div class="saldo" id="resultSaldo"></div>
    </div>
  </div>
  <div id="status">Richt de camera op de QR-code</div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
  // ---- CONFIGURATIE: pas dit aan per vereniging voordat je deployt ----
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKkOQ_2MRJY4wv8mBdBDwcIceCDN_KJQLSiONLJaSSJ40Os6OXpAmGYYiCbLidbLijbA/exec';
  // -----------------------------------------------------------------

  let scannerPassword = '';
  let scanning = false;
  let processing = false;
  let cooldownUntil = 0;
  const SCAN_LOOP_COOLDOWN_MS = 3000; // stop met scannen na een resultaat
  let berichtDuurMs = 5000; // wordt overschreven met instelling uit adminpaneel bij inloggen

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  async function login(e) {
    if (e) e.preventDefault();
    const pw = document.getElementById('loginPassword').value;
    if (!pw) return;
    scannerPassword = pw;
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'checkAdminPassword', adminPassword: pw })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Ongeldig wachtwoord');
      berichtDuurMs = (json.data.berichtDuurSeconden || 5) * 1000;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('scanScreen').style.display = 'flex';
      document.getElementById('verenigingTitel').textContent = json.data.verenigingNaam;
      startCamera();
    } catch (err) {
      const msg = document.getElementById('loginMsg');
      msg.textContent = err.message;
      msg.className = 'msg show';
    }
  }

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      video.srcObject = stream;
      video.addEventListener('loadedmetadata', () => {
        scanning = true;
        requestAnimationFrame(scanLoop);
      });
    } catch (err) {
      document.getElementById('status').textContent = 'Kan camera niet openen: ' + err.message;
    }
  }

  function scanLoop() {
    if (!scanning) return;

    if (processing || Date.now() < cooldownUntil) {
      requestAnimationFrame(scanLoop);
      return;
    }

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) {
        processing = true; // meteen blokkeren, voordat het antwoord binnen is
        handleScan(code.data);
        requestAnimationFrame(scanLoop);
        return;
      }
    }
    requestAnimationFrame(scanLoop);
  }

  async function handleScan(token) {
    document.getElementById('status').textContent = 'Bezig met controleren...';
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'scan', token: token })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error);
      showResult(json.data);
    } catch (err) {
      showResult({ naam: '', toegestaan: false, melding: err.message, saldo: '' });
    } finally {
      processing = false;
      cooldownUntil = Date.now() + SCAN_LOOP_COOLDOWN_MS;
    }
  }

  function piepEnTril(toegestaan) {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctxAudio = new AudioCtx();
      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      osc.connect(gain);
      gain.connect(ctxAudio.destination);
      gain.gain.setValueAtTime(0.3, ctxAudio.currentTime);
      if (toegestaan) {
        osc.type = 'sine';
        osc.frequency.value = 880;
        osc.start();
        osc.stop(ctxAudio.currentTime + 0.15);
      } else {
        osc.type = 'square';
        osc.frequency.value = 220;
        osc.start();
        osc.stop(ctxAudio.currentTime + 0.35);
      }
    } catch (e) { /* geluid niet ondersteund, geen probleem */ }

    if (navigator.vibrate) {
      navigator.vibrate(toegestaan ? 120 : [100, 80, 100]);
    }
  }

  function showResult(data) {
    const overlay = document.getElementById('resultOverlay');
    overlay.className = data.toegestaan ? 'ok' : 'err';
    document.getElementById('resultNaam').textContent = data.naam || '';
    document.getElementById('resultMelding').textContent = data.melding;
    document.getElementById('resultSaldo').textContent =
      data.saldo !== '' && data.saldo !== undefined ? 'Nog ' + data.saldo + ' ritten over' : '';
    overlay.style.display = 'flex';
    piepEnTril(data.toegestaan);
    document.getElementById('status').textContent = 'Richt de camera op de QR-code';
    setTimeout(() => { overlay.style.display = 'none'; }, berichtDuurMs);
  }
</script>
</body>
</html>
