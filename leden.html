<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn rittenkaart</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --primary: #2c6e49;
    --primary-dark: #1f4d33;
    --text: #1c1c1c;
    --muted: #6b7280;
    --border: #e2e4e8;
    --danger: #b3261e;
    --danger-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
  }
  .wrap { max-width: 400px; margin: 40px auto 0; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; text-align: center; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  button {
    margin-top: 16px;
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: var(--primary-dark); }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; display: none; }
  .msg.err { background: var(--danger-bg); color: var(--danger); display: block; }

  #resultaat { display: none; text-align: center; margin-top: 20px; }
  #resultaat .naam { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
  .qr-code { width: 200px; height: 200px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: white; }
  .saldo-groot { font-size: 2.6rem; font-weight: 700; color: var(--primary); line-height: 1; }
  .saldo-label { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .laatste-bezoek { margin-top: 18px; font-size: 0.9rem; color: var(--muted); }
  .terug-btn {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--primary);
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Mijn rittenkaart</h1>
  <p class="subtitle">Bekijk je tegoed en laatste bezoek</p>

  <div class="card">
    <div id="zoekForm">
      <label>Lidnummer</label>
      <input id="lidnummer" placeholder="bv. 1042">
      <label>E-mailadres</label>
      <input id="email" type="email" placeholder="naam@voorbeeld.nl">
      <button onclick="bekijkStatus()">Bekijk mijn tegoed</button>
      <div id="zoekMsg" class="msg"></div>
    </div>

    <div id="resultaat">
      <div class="naam" id="resNaam"></div>
      <img id="resQr" class="qr-code" alt="Jouw QR-code">
      <div class="saldo-groot" id="resSaldo"></div>
      <div class="saldo-label">ritten over</div>
      <div class="laatste-bezoek" id="resLaatsteBezoek"></div>
      <button class="terug-btn" onclick="terug()">Andere gegevens invoeren</button>
    </div>
  </div>
</div>

<script>
  // ---- CONFIGURATIE: pas dit aan per vereniging voordat je deployt ----
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKkOQ_2MRJY4wv8mBdBDwcIceCDN_KJQLSiONLJaSSJ40Os6OXpAmGYYiCbLidbLijbA/exec';
  // -----------------------------------------------------------------

  async function bekijkStatus() {
    const lidnummer = document.getElementById('lidnummer').value.trim();
    const email = document.getElementById('email').value.trim();
    const msg = document.getElementById('zoekMsg');
    msg.className = 'msg';

    if (!lidnummer || !email) {
      msg.textContent = 'Vul lidnummer en e-mailadres in.';
      msg.className = 'msg err';
      return;
    }

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'memberStatus', lidnummer, email })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error);

      document.getElementById('resNaam').textContent = 'Hoi ' + json.data.naam;
      document.getElementById('resQr').src =
        'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(json.data.token);
      document.getElementById('resSaldo').textContent = json.data.saldo;
      document.getElementById('resLaatsteBezoek').textContent = 'Laatste bezoek: ' + json.data.laatsteBezoek;
      document.getElementById('zoekForm').style.display = 'none';
      document.getElementById('resultaat').style.display = 'block';
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg err';
    }
  }

  function terug() {
    document.getElementById('resultaat').style.display = 'none';
    document.getElementById('zoekForm').style.display = 'block';
  }
</script>
</body>
</html>
